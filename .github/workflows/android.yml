name: Android

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/android.yml"

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="${RUNNER_TEMP}/android-sdk"
          mkdir -p "${SDK}/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp
          mv /tmp/cmdline-tools "${SDK}/cmdline-tools/latest"
          yes | "${SDK}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${SDK}" --licenses >/dev/null || true
          "${SDK}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${SDK}" --install "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=${SDK}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK}" >> "${GITHUB_ENV}"
      - name: Build debug APK
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew :pebble:assembleDebug --no-daemon
