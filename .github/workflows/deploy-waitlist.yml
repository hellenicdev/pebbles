name: Deploy waitlist

on:
  push:
    branches: [main]
    paths:
      - "server/waitlist/**"
      - ".github/workflows/deploy-waitlist.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-waitlist
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/waitlist
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/waitlist/package-lock.json

      - name: Install and typecheck
        run: |
          npm ci
          npm run check

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${MAILERLITE_API_KEY}" ]; then
            echo "Skipping deploy: CLOUDFLARE_API_TOKEN or MAILERLITE_API_KEY is not set."
            exit 0
          fi
          npx wrangler deploy
          printf '%s' "$MAILERLITE_API_KEY" | npx wrangler secret put MAILERLITE_API_KEY
