name: Release APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the APK to, such as v0.5.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Version
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          VER="${TAG#v}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VER}" >> "${GITHUB_OUTPUT}"
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK="${RUNNER_TEMP}/android-sdk"
          mkdir -p "${SDK}/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp
          mv /tmp/cmdline-tools "${SDK}/cmdline-tools/latest"
          yes | "${SDK}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${SDK}" --licenses >/dev/null || true
          "${SDK}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${SDK}" --install "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=${SDK}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK}" >> "${GITHUB_ENV}"
      - name: Build the release APK
        id: build
        working-directory: app
        env:
          PEBBLES_STORE_BASE64: ${{ secrets.PEBBLES_STORE_BASE64 }}
          PEBBLES_STORE_PASSWORD: ${{ secrets.PEBBLES_STORE_PASSWORD }}
          PEBBLES_KEY_ALIAS: ${{ secrets.PEBBLES_KEY_ALIAS }}
          PEBBLES_KEY_PASSWORD: ${{ secrets.PEBBLES_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${PEBBLES_STORE_BASE64}" ] || [ -z "${PEBBLES_STORE_PASSWORD}" ] || [ -z "${PEBBLES_KEY_ALIAS}" ] || [ -z "${PEBBLES_KEY_PASSWORD}" ]; then
            echo "built=false" >> "${GITHUB_OUTPUT}"
            echo "Signing secrets are not set. No APK attached."
            exit 0
          fi
          echo "${PEBBLES_STORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/pebbles-release.jks"
          export PEBBLES_STORE_FILE="${RUNNER_TEMP}/pebbles-release.jks"
          chmod +x gradlew
          ./gradlew :pebble:assembleRelease --no-daemon -PversionName="${{ steps.ver.outputs.version }}"
          ASSET="${RUNNER_TEMP}/pebbles-${{ steps.ver.outputs.version }}.apk"
          cp pebble/build/outputs/apk/release/pebble-release.apk "${ASSET}"
          echo "built=true" >> "${GITHUB_OUTPUT}"
          echo "apk=${ASSET}" >> "${GITHUB_OUTPUT}"
      - name: Attest the release APK
        if: steps.build.outputs.built == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.build.outputs.apk }}
      - name: Attach the release APK
        if: steps.build.outputs.built == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ steps.ver.outputs.tag }}" "${{ steps.build.outputs.apk }}" --clobber --repo "${{ github.repository }}"
