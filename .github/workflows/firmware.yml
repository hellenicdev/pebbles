name: Firmware

on:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"

jobs:
  pebble:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4
      options: --entrypoint ""
    steps:
      - uses: actions/checkout@v4
      - name: Build pebble
        working-directory: firmware/pebble
        run: |
          . "${IDF_PATH}/export.sh"
          idf.py build

  dock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the RISC-V toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf picolibc-riscv64-unknown-elf
      - name: Fetch ch32v003fun
        run: git clone --depth 1 https://github.com/cnlohr/ch32v003fun.git "${RUNNER_TEMP}/ch32v003fun"
      - name: Build dock
        working-directory: firmware/dock
        run: make CH32FUN="${RUNNER_TEMP}/ch32v003fun/ch32fun"
