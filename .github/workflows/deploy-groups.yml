name: Groups API

on:
  push:
    branches: [main]
    paths:
      - "server/groups/**"
      - ".github/workflows/deploy-groups.yml"
  pull_request:
    paths:
      - "server/groups/**"
      - ".github/workflows/deploy-groups.yml"

permissions:
  contents: read

concurrency:
  group: groups-api
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/groups
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/groups/package-lock.json
      - name: Install, typecheck, and test
        run: |
          npm ci
          npm run check
          npm test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/groups
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/groups/package-lock.json
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npm ci
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "Skipping deploy: CLOUDFLARE_API_TOKEN is not set."
            exit 0
          fi
          if grep -q '00000000-0000-0000-0000-000000000000' wrangler.toml; then
            echo "Skipping deploy: create the D1 database and set database_id in wrangler.toml."
            exit 0
          fi
          npx wrangler d1 migrations apply pebbles-groups --remote
          npx wrangler deploy
